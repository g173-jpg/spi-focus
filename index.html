</style></head><body><header><a class="brand" href="#"><span class="mark">S<span>F</span></span>SPI <b>FOCUS</b></a><span class="header-label">能力検査トレーニング</span><span class="practice-tag">非公式・オリジナル問題</span></header><main id="app"></main><footer><span>SPI FOCUS</span><span>速さと正確さを、一問ずつ。</span></footer><script>const BANK=[];
function add(section,type,level,seconds,text,options,answer,explanation){BANK.push({id:BANK.length,section,type,level,seconds,text,options,answer,explanation});}
const V=(t,l,s,q,o,a,e)=>add('言語',t,l,s,q,o,a,e);
const N=(t,l,s,q,o,a,e)=>add('非言語',t,l,s,q,o,a,e);
V('二語の関係',1,30,'「医師：診察」と同じ関係になる組を選びなさい。',['画家：絵画','教師：授業','病院：患者','料理：食材','学校：教室'],1,'職業と、その職業の人が行う仕事の関係。医師は診察を行い、教師は授業を行う。');
V('二語の関係',1,30,'「樹木：森林」と同じ関係になる組を選びなさい。',['水：氷','魚：海','星：星座','紙：文字','山：谷'],2,'個々のものと、その集まりの関係。樹木の集まりが森林、星の集まりが星座。');
V('二語の関係',2,35,'「鋳型：金属」と同じ関係になる組を選びなさい。',['筆：絵画','設計：建物','包丁：料理','製氷皿：水','窓：ガラス'],3,'容器・型と、その中に入れて成形する材料の関係。');
V('二語の関係',2,35,'「辞書：語義」と同じ関係になる組を選びなさい。',['地図：位置','道路：車','時計：歯車','小説：作家','新聞：紙'],0,'情報を調べる道具と、そこで調べられる情報の関係。辞書で語義、地図で位置を調べる。');
V('語句の意味',1,30,'「物事の道理に明るく、判断が適切である」に最も近い語を選びなさい。',['実直','温厚','聡明','寛容','謙虚'],2,'聡明は理解力・判断力にすぐれていること。実直は誠実で正直なこと。');
V('語句の意味',2,30,'「その場しのぎの対応」を意味する語を選びなさい。',['周到','場当たり','漸進','率先','適宜'],1,'場当たりは、先を見通す計画を持たず、その場の状況だけで対応すること。');
V('語句の意味',3,35,'「両者の説明には齟齬がある」の「齟齬」に最も近い意味を選びなさい。',['補足','重複','隔たりのない一致','食い違い','強い確信'],3,'齟齬（そご）は、物事がかみ合わず食い違うこと。');
V('語句の意味',3,35,'「議論が膠着する」の「膠着」に最も近い意味を選びなさい。',['決着して終わる','進展しなくなる','急速に広がる','具体性を増す','最初に戻る'],1,'膠着（こうちゃく）は、状態が固定し、動きや進展がなくなること。');
V('熟語の成り立ち',1,30,'「増減」の成り立ちとして最も適切なものを選びなさい。',['似た意味の漢字を重ねる','反対の意味の漢字を重ねる','前の漢字が後の漢字を修飾する','後の漢字が前の漢字の目的語になる','主語と述語の関係'],1,'増える・減るという反対の意味の漢字を組み合わせている。');
V('熟語の成り立ち',2,35,'「読書」の成り立ちとして最も適切なものを選びなさい。',['同義','対義','修飾・被修飾','動作・目的語','主語・述語'],3,'書を読むという関係。「読む」という動作の目的語が「書」。');
V('熟語の成り立ち',2,35,'「国営」の成り立ちとして最も適切なものを選びなさい。',['同義','対義','修飾・被修飾','動作・目的語','主語・述語'],4,'国が営むという主語・述語の関係。');
V('熟語の成り立ち',1,30,'「急流」の成り立ちとして最も適切なものを選びなさい。',['同義','対義','前の字が後の字を修飾','動作・目的語','主語・述語'],2,'急な流れというように、「急」が「流」を修飾している。');
V('空欄補充',2,45,'新しい制度を導入する際には、効率性だけでなく、公平性との（　）を図ることが重要である。',['迎合','均衡','断絶','譲歩','反証'],1,'「均衡を図る」は、複数の要素のバランスを保つこと。');
V('空欄補充',2,45,'この調査から二つの事象の関連は読み取れる。しかし、それだけで因果関係を（　）することはできない。',['示唆','想起','断定','考慮','推測'],2,'関連があるという観察だけでは、原因と結果だと確定できない。「断定」が適切。');
V('空欄補充',3,50,'仮説に合う事例だけを集めても、検証としては不十分である。むしろ、その仮説を（　）しうる事例を探す姿勢が求められる。',['追認','補強','反証','踏襲','代弁'],2,'仮説が誤りだと示す可能性がある事例を探し、成立するかを確かめる。「反証」が適切。');
V('文の並べ替え',2,55,'次の文を自然な順に並べなさい。\nア しかし、そのままでは利用者に伝わらない。\nイ 調査によって多くの情報が得られた。\nウ そこで、目的別に情報を整理した。\nエ その結果、必要な情報を探しやすくなった。',['イ→ア→ウ→エ','イ→ウ→ア→エ','ア→イ→エ→ウ','ウ→イ→ア→エ','イ→エ→ア→ウ'],0,'情報を得る→そのままでは伝わらないという課題→整理という対策→効果、の順。');
V('文の並べ替え',3,60,'次の文を自然な順に並べなさい。\nア このような小さな修正の積み重ねが、製品の質を高める。\nイ 試作品を実際の利用者に使ってもらった。\nウ その指摘を受け、ボタンの位置を変更した。\nエ すると、操作しづらいという意見が寄せられた。',['イ→ウ→エ→ア','イ→エ→ウ→ア','エ→イ→ア→ウ','ウ→イ→エ→ア','ア→ウ→イ→エ'],1,'試用→意見→その指摘に基づく修正→修正の意義というまとめ。');
V('長文読解',2,75,'文章を読み、内容と一致するものを選びなさい。\n\n都市の緑地には、気温の上昇を抑える働きがある。ただし、その効果は緑地の面積だけでは決まらない。樹木の種類や配置、風の通り道などにも左右される。そのため、緑地を増やす政策では、面積を確保するだけでなく、地域の環境に応じた設計が必要になる。',['緑地の効果は面積だけで決まる','樹木の種類は気温に影響しない','地域の環境に応じた緑地設計が必要だ','緑地の面積を増やしても効果はない','風が強ければ緑地は不要だ'],2,'本文は面積以外に樹種・配置・風も影響すると述べ、地域に応じた設計を求めている。');
V('長文読解',3,85,'文章を読み、筆者の主張として最も適切なものを選びなさい。\n\n情報を短くまとめることは、単に文字数を減らすことではない。すべての部分を同じ割合で削れば、文章は短くなるが、主張の根拠まで失われるおそれがある。要約には、情報の役割を見極め、結論を支える関係を保ったまま、枝葉を取り除く判断が必要である。',['要約では結論だけを残すべきだ','要約は情報の構造を保つ選択的な作業だ','文章の各部分を均等に削るべきだ','短い文章には根拠が不要だ','原文より長い要約が望ましい'],1,'結論と根拠の関係を保ちながら不要な情報を取り除くことを重視している。');

function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a);}
function fraction(n,d){const g=gcd(n,d);return d/g===1?String(n/g):`${n/g}/${d/g}`;}
function fractionOptions(n,d){const answer=fraction(n,d);const options=[answer];for(const [a,b] of [[n+1,d],[n-1,d],[n,d+1],[d-n,d],[1,2],[1,3],[2,3],[1,4],[3,4]]){if(a<=0||a>=b)continue;const f=fraction(a,b);if(!options.includes(f))options.push(f);if(options.length===5)break;}if(options.length!==5)throw Error('Insufficient fraction options');return options;}

</script><script>function rulesMarkup(){return `<details class="panel details"><summary>出題範囲・本番との違い</summary><div class="content"><p>本サイトは非公式のオリジナル模試です。テストセンター形式の実戦模試は言語20問・非言語20問を合計35分で解き、続けて英語30問・20分に進みます。英語は本番では企業による追加検査です。この模試では英語の練習を含めるために組み込んでいます。</p><p>WEBテスティング形式の実戦模試は言語20問・非言語20問・35分で、英語はありません。テストセンターのオンライン会場とWEBテスティングは別の方式です。ミニ模試は両形式とも言語5問・非言語5問・10分、英語練習はテストセンター形式で選べます。</p><table class="format-table"><tr><th>収録する形式の違い</th><th>テストセンター</th><th>WEB</th></tr><tr><td>二語の関係・語句の意味</td><td>あり</td><td>なし</td></tr><tr><td>熟語の成り立ち・3語補充</td><td>なし</td><td>あり</td></tr><tr><td>文節の並び換え・読解</td><td>あり</td><td>あり</td></tr><tr><td>精算・割引・分割払い</td><td>あり</td><td>なし</td></tr><tr><td>仕事算</td><td>あり</td><td>あり</td></tr><tr><td>非言語の数値解答</td><td>選択式</td><td>数値入力</td></tr><tr><td>英語</td><td>実戦模試に含む</td><td>なし</td></tr></table><p>装置と回路・物の流れ・領域などのペーパー専用分野は収録対象外です。従来の濃度算20問と数列1問は、今回の対象として十分に確認できなかったため削除しました。濃度算については対策サイト間で説明に差があり、「ペーパー専用」と断定したものではありません。両形式と共通する分野の問題は残しています。</p><p>難易度は各科目で標準から始まり、正解なら基礎→標準→応用、不正解・時間切れならその逆に1段階動きます。上下限は基礎・応用です。次の難易度に未使用の問題がなければ近い段階を使います。その段階で出題回数の少ない問題を優先します。本番の非公開の適応型アルゴリズム・得点尺度は再現していません。ジャンルや難易度は解答中には表示せず、終了後の解説で確認できます。</p><p>1問の上限は30〜85秒の独自設定です。基礎能力の時間が切れると未出題分を残して英語に進みます。基礎能力を早く解き終わっても英語に時間は持ち越しません。英語の終了で全体を採点します。未回答・未出題も正答率の分母に含みます。問題数や出題順は練習用の固定構成です。</p><p>WEBの数値入力は分数（3/4等）にも対応し、等しい値を正解とします。数値でない推論は選択式です。履歴はこのブラウザーだけに保存されます。再読み込みで進行中の解答は失われますが、保存済みの出題履歴は残ります。画面を離れても計時は続きます。性格検査・構造的把握力検査は対象外です。</p></div></details><details class="panel details"><summary>参考資料と調査方針 · 2026年9月12日確認</summary><div class="content"><ul><li><a href="https://www.recruit-ms.co.jp/freshers/spi-010.html" target="_blank" rel="noopener">リクルートMS公式：WEBテスティングについて</a><br>WEBは言語・非言語であること、テストセンターのオンライン会場とは別方式であることを確認。</li><li><a href="https://www.spi.recruit.co.jp/testcenter/faq.html" target="_blank" rel="noopener">SPI公式FAQ</a> ／ <a href="https://www.spi.recruit.co.jp/spi3news/000604.html" target="_blank" rel="noopener">開発者インタビュー（2026年4月14日）</a><br>英語の追加検査と適応型出題の基本を確認。</li><li><a href="https://spi-webtest.com/subject/" target="_blank" rel="noopener">SPI対策サイト：科目・出題範囲（2025年8月16日更新表記）</a> ／ <a href="https://spi-webtest.com/practice-questions/" target="_blank" rel="noopener">練習問題集</a><br>形式別の分野と分数解答などを確認。数値・正答は独立して検証。</li><li><a href="https://www.spi-online.net/exam/" target="_blank" rel="noopener">SPIオンライン：模擬試験</a><br>テストセンターの速度算・損益算・確率・推論・語句などの構成を参考にしました。同サイト独自の模試時間は本番時間の根拠にしていません。</li><li><a href="https://spicompass.com/" target="_blank" rel="noopener">SPI Compass</a><br>受検形式別に演習を分ける構成と復習導線を参考にしました。形式別の出題範囲は他資料とも照合。</li><li><a href="https://saisokuspi.com/gaiyou/taisaku_testcenter/3/20/" target="_blank" rel="noopener">Study Pro：形式別の出題範囲比較（2028年卒向け表記）</a><br>言語・非言語・英語の比較表で照合。卒年の表記を更新日の証拠とはしていません。</li><li><a href="https://www.otona-juku.com/spi-preparation/web_testing/" target="_blank" rel="noopener">大人塾：WEBテスティング非言語対策</a><br>数値入力・電卓利用・仕事算等の範囲を確認。</li><li><a href="https://www.jasso.go.jp/ryugaku/after_study_j/job/guide.html" target="_blank" rel="noopener">JASSO：就活ガイド2027</a> ／ <a href="https://careerpark.jp/50702" target="_blank" rel="noopener">キャリアパーク：英語検査（2021年10月1日更新）</a><br>時間枠の参考資料。問題数は本サイト独自の設定です。</li></ul><p>問題は転載せず独自に作成しています。公開日の新しさだけでなく、公式性・形式ごとの記述・複数資料の一致を重視しました。対策サイト間で範囲が異なる部分は保守的に振り分けています。全出題分野の網羅や、年度別の本番問題の再現を保証するものではありません。上記は手動確認日で、自動更新機能はありません。</p></div></details>`;}
</script><script>const app=document.querySelector('#app');
let mode='full',format='center',state=null,ticker=null;

const FORMAT_NAMES={center:'テストセンター',web:'WEBテスティング'};
function config(m=mode){const basic={label:'基礎能力',seconds:m==='short'?600:2100,parts:[{name:'言語',count:m==='short'?5:20},{name:'非言語',count:m==='short'?5:20}]};const english={label:'英語',seconds:1200,parts:[{name:'英語',count:30}]};const blocks=m==='english'?[english]:m==='full'&&format==='center'?[basic,english]:[basic];return {title:m==='english'?'英語練習':m==='short'?'ミニ模試':'実戦模試',blocks,parts:blocks.flatMap(b=>b.parts),minutes:blocks.reduce((n,b)=>n+b.seconds,0)/60,count:blocks.flatMap(b=>b.parts).reduce((n,p)=>n+p.count,0)};}
function pool(section){return BANK.filter(q=>q.section===section&&q.formats.includes(format));}

const HISTORY_KEY='spi-focus-exposure-v2';
let exposure={},historyAvailable=true;
try { const value=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}'); if(value&&typeof value==='object'&&!Array.isArray(value)){for(const q of BANK){const n=value[q.id];if(Number.isSafeInteger(n)&&n>0)exposure[q.id]=n;}} localStorage.setItem(HISTORY_KEY,JSON.stringify(exposure)); } catch { historyAvailable=false; }
function remember(q){exposure[q.id]=(exposure[q.id]||0)+1;try{localStorage.setItem(HISTORY_KEY,JSON.stringify(exposure));}catch{historyAvailable=false;}}
function unseen(section){return BANK.filter(q=>(!section||q.section===section)&&!exposure[q.id]).length;}
function selectQuestion(section){
 const candidates=shuffle(BANK.filter(q=>q.section===section&&q.formats.includes(state.format)&&!state.used.has(q.id)));
 if(!candidates.length)throw Error('Question pool exhausted');
 const types={},families={};for(const a of state.answers){types[a.q.type]=(types[a.q.type]||0)+1;const f=a.q.family||a.q.id;families[f]=(families[f]||0)+1;}
 const target=state.levels[section]||2;
 candidates.sort((a,b)=>Math.abs(a.level-target)-Math.abs(b.level-target)||(exposure[a.id]||0)-(exposure[b.id]||0)||(families[a.family||a.id]||0)-(families[b.family||b.id]||0)||(types[a.type]||0)-(types[b.type]||0));
 const q=candidates[0],order=shuffle(q.options.map((_,i)=>i));return {...q,options:order.map(i=>q.options[i]),answer:order.indexOf(q.answer),input:state.format==='web'&&q.numericAnswer!==undefined?'numeric':'choice'};
}
function progressMarkup(){const c=config(),available=BANK.filter(q=>q.formats.includes(format)&&c.parts.some(p=>p.name===q.section));return '<section class="practice-progress panel"><div><span class="eyebrow">QUESTION LIBRARY</span><h2>'+BANK.length+'問のオリジナル問題</h2><p>選択形式の対象：'+available.length+'問（数値違いの類題を含む）</p></div><div class="unseen"><strong>'+available.filter(q=>!exposure[q.id]).length+'</strong><span>選択形式の未出題</span></div><p class="storage-note">'+(historyAvailable?'出題履歴をこのブラウザーに保存中。自動調整した難易度の中で未出題を優先します。':'履歴を保存できません。画面を開いている間だけ出題履歴を保持します。')+' 別の端末とは同期しません。</p></section>';}
function numericValue(text){const t=String(text).normalize('NFKC').replace(/\s/g,'');if(!/^-?\d+(?:\.\d+)?(?:\/\d+)?$/.test(t))return null;const [a,b=1]=t.split('/').map(Number);const v=a/b;return b!==0&&Number.isFinite(v)?v:null;}
function answerControls(q){return q.input==='numeric'?'<label class="numeric-label" for="numeric-answer">解答</label><div class="numeric-row"><input id="numeric-answer" type="text" autocomplete="off" spellcheck="false" aria-describedby="numeric-hint" maxlength="40"><span>'+esc(q.unit||'')+'</span></div><p class="hint" id="numeric-hint">数値だけを入力してください。分数は 3/4 のように入力できます。単位は不要です。</p>':'<div class="options" role="group" aria-label="解答の選択肢">'+q.options.map((o,i)=>'<button class="option" data-answer="'+i+'" aria-pressed="false"><span class="letter">'+'ABCDE'[i]+'</span><span>'+esc(o)+'</span></button>').join('')+'</div>';}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}`;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){clearInterval(ticker);state=null;if(format==='web'&&mode==='english')mode='full';const c=config();app.innerHTML=`<p class="eyebrow">PRACTICE / SPI</p><h1 class="page-title">本番の形式に合わせて、練習する。</h1><p class="intro">難易度は正誤に応じて自動調整。まずは受検形式を選ぼう。</p><div class="layout"><section class="panel"><div class="panel-body"><h2 class="panel-heading"><span class="small-step">01</span>受検形式</h2><div class="format-options">${Object.entries(FORMAT_NAMES).map(([k,n])=>`<button class="difficulty-option ${format===k?'active':''}" data-format="${k}" aria-pressed="${format===k}"><strong>${n}</strong><small>${k==='center'?'選択式・電卓なし':'非言語は数値入力・電卓可'}</small></button>`).join('')}</div><h2 class="panel-heading"><span class="small-step">02</span>模試を選ぶ</h2><div class="modes">${(format==='center'?['full','short','english']:['full','short']).map(k=>{const m=config(k);return `<button class="mode ${mode===k?'active':''}" data-mode="${k}" aria-pressed="${mode===k}"><span class="radio"></span><small>${k==='full'?'FULL PRACTICE':k==='short'?'QUICK PRACTICE':'ENGLISH'}</small><strong>${m.title}</strong><span class="minutes">${m.minutes}<small>分</small></span><span class="count">全${m.count}問</span></button>`}).join('')}</div><div class="adaptive-note"><b>基礎 ⇄ 標準 ⇄ 応用</b><p>各科目は標準から開始。正解なら1段階上、不正解・時間切れなら1段階下を目安に、次の問題を選びます。</p></div><div class="rules-strip"><span>問題別タイマー</span><span>解答後の戻り不可</span><span>ジャンル表示なし</span></div><button class="start" id="start">${c.title}を開始する <span aria-hidden="true">→</span></button><p class="hint">クリックすると計時開始。メモ用紙と筆記具${format==='web'?'、電卓':''}をご用意ください。</p></div></section><aside class="panel side"><div class="panel-body"><h2>今回の構成</h2>${c.blocks.map(b=>`<div class="structure"><div><strong>${b.label} · ${b.seconds/60}分</strong><p>${b.parts.map(p=>p.name+' '+p.count+'問').join(' → ')}</p></div></div>`).join('')}<div class="side-note">${format==='center'&&mode==='full'?'基礎能力の終了後、そのまま英語へ進みます。残り時間は持ち越しません。':format==='web'?'WEBテスティングには英語を含めません。英語を含む実戦模試はテストセンター形式を選んでください。':'選択した科目を練習できます。'}<br>英語は本番では企業による追加検査です。</div></div></aside></div><p class="format-summary">${c.blocks.map(b=>b.parts.map(p=>p.name+' '+p.count+'問').join('・')+'（'+b.seconds/60+'分）').join(' → ')}${format==='web'?' ／ 英語なし':''}</p>${progressMarkup()}${rulesMarkup()}`;
app.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{format=b.dataset.format;home()});app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;home()});document.querySelector('#start').onclick=start;}

function start(){clearInterval(ticker);const now=Date.now(),c=config();state={...c,format,start:now,duration:c.minutes*60,answers:[],used:new Set(),levels:{言語:2,非言語:2,英語:2},selected:null,current:null,active:true,notice:'',position:0,block:0,blockStart:now,elapsedPrior:0};state.slots=c.blocks.flatMap((b,bi)=>b.parts.flatMap(p=>Array.from({length:p.count},()=>({section:p.name,block:bi}))));state.end=now+c.blocks[0].seconds*1000;next();ticker=setInterval(tick,150);}
function advanceBlock(timedOut=false){const now=Date.now();state.elapsedPrior+=Math.min(state.blocks[state.block].seconds,(now-state.blockStart)/1000);if(timedOut){while(state.position<state.count&&state.slots[state.position].block===state.block)state.position++;}state.current=null;state.block++;if(state.block>=state.blocks.length){finish(timedOut?'time':'complete');return;}state.blockStart=timedOut?state.end:now;state.end=state.blockStart+state.blocks[state.block].seconds*1000;state.notice='基礎能力が終了しました。ここから英語の20分が始まります。';next();}
function next(){if(state.position>=state.count){finish('complete');return;}if(state.slots[state.position].block!==state.block){advanceBlock();return;}if(Date.now()>=state.end){expireBlock();return;}const section=state.slots[state.position].section;state.current=selectQuestion(section);state.used.add(state.current.id);remember(state.current);state.selected=null;state.qStart=Date.now();state.qEnd=state.qStart+state.current.seconds*1000;renderQuestion();tick();}
function saveAnswer(expired){const q=state.current;if(!q)return;const selected=expired?null:state.selected;const correct=selected!==null&&(q.input==='numeric'?numericValue(selected)!==null&&Math.abs(numericValue(selected)-numericValue(q.numericAnswer))<1e-9:selected===q.answer);state.answers.push({q,selected,correct,expired,number:state.position+1,seconds:Math.min(q.seconds,Math.max(0,(Date.now()-state.qStart)/1000))});state.levels[q.section]=Math.max(1,Math.min(3,q.level+(correct?1:-1)));state.position++;state.current=null;}
function expireBlock(){saveAnswer(true);advanceBlock(true);}

function renderQuestion(){const q=state.current;app.innerHTML=`<div class="exam-top"><div><p class="eyebrow">PRACTICE</p><h1>受検中</h1></div><button class="button-quiet" id="quit">模試を終了</button></div>${state.notice?`<div class="notice" role="status">${state.notice}</div>`:''}<div class="layout exam-layout"><section class="panel"><div class="question-head"><span class="q-number">QUESTION ${String(state.position+1).padStart(2,'0')}</span></div><div class="panel-body"><h2 class="question-text" tabindex="-1">${esc(q.text)}</h2>${answerControls(q)}<button class="start" id="submit" disabled>解答して${state.position===state.count-1?'結果へ':'次へ'} <span aria-hidden="true">→</span></button><p class="hint">確定後は戻れません。未選択のまま時間切れになると未回答になります。</p></div></section><aside class="panel"><div class="time-panel"><div class="time-label">この問題の残り時間</div><div class="timer" id="q-time" aria-label="問題の残り時間"></div><div class="track"><div class="fill" id="time-fill"></div></div><div class="total-clock"><span>この検査の残り時間</span><b id="all-time"></b></div><div class="time-label progress-label">進捗　${state.position} / ${state.count} 問</div><div class="progress-dots">${Array.from({length:state.count},(_,i)=>`<span class="dot ${i<state.position?'done':i===state.position?'current':''}"></span>`).join('')}</div><p class="exam-note">1問の上限：${q.seconds}秒<br>時間切れで自動的に次へ進みます。選択しただけでは解答は確定されません。</p></div></aside></div><dialog id="quit-dialog" aria-labelledby="quit-title"><h2 id="quit-title">ここで模試を終了しますか？</h2><p>途中結果と解説を表示します。終了するとこの模試には戻れません。確認中も時間は進みます。</p><div class="actions"><button id="continue">続ける</button><button id="end-now" class="primary">終了して結果を見る</button></div></dialog>`;
if(q.input==='numeric'){document.querySelector('#numeric-answer').oninput=e=>{state.selected=e.target.value;document.querySelector('#submit').disabled=numericValue(e.target.value)===null;};}
app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(Date.now()>=Math.min(state.qEnd,state.end)){tick();return}state.selected=Number(b.dataset.answer);app.querySelectorAll('[data-answer]').forEach(x=>{const on=x===b;x.classList.toggle('selected',on);x.setAttribute('aria-pressed',String(on))});document.querySelector('#submit').disabled=false;});document.querySelector('#submit').onclick=()=>{if(Date.now()>=Math.min(state.qEnd,state.end)){tick();return}record(false);};document.querySelector('#quit').onclick=()=>document.querySelector('#quit-dialog').showModal();document.querySelector('#continue').onclick=()=>document.querySelector('#quit-dialog').close();document.querySelector('#end-now').onclick=()=>finish('stopped');app.querySelector('.question-text').focus({preventScroll:true});}
function record(expired){saveAnswer(expired);state.notice=expired?'前の問題は時間切れのため、未回答になりました。':'';next();}
function tick(){if(!state?.active)return;const now=Date.now();if(now>=state.end){expireBlock();return}if(now>=state.qEnd){record(true);return}const remain=Math.ceil((state.qEnd-now)/1000);document.querySelector('#q-time').textContent=fmt(remain);document.querySelector('#q-time').classList.toggle('urgent',remain<=10);document.querySelector('#all-time').textContent=fmt(Math.ceil((state.end-now)/1000));document.querySelector('#time-fill').style.width=`${Math.max(0,(state.qEnd-now)/(state.current.seconds*1000)*100)}%`;}
function finish(reason){if(!state?.active)return;if(reason==='stopped')saveAnswer(true);state.active=false;clearInterval(ticker);state.reason=reason;state.elapsed=state.elapsedPrior+(state.block<state.blocks.length?Math.min(state.blocks[state.block].seconds,(Date.now()-state.blockStart)/1000):0);renderResult();}

function renderResult(){const a=state.answers;const right=a.filter(x=>x.correct).length,rate=Math.round(right/state.count*100),answered=a.filter(x=>x.selected!==null);const stats=state.parts.map(p=>({section:p.name,right:a.filter(x=>x.q.section===p.name&&x.correct).length,count:p.count}));app.innerHTML=`<p class="eyebrow">TEST RESULT</p><h1 class="page-title">${state.reason==='stopped'?'途中結果':state.reason==='time'?'制限時間に達しました':'模試、おつかれさまでした。'}</h1><p class="intro">解けた問題も、迷った問題も。解説で次の一問につなげよう。</p><section class="panel panel-body"><div class="score-layout"><div class="score-ring" style="--pct:${rate}%"><div><span>正答率</span><b>${rate}<small> %</small></b><span>${right} / ${state.count}問 正解</span></div></div><div><h2 class="panel-heading">${right>=state.count*.8?'よくできました。解く速さも確認しましょう。':right>=state.count*.5?'解き方を整理して、正確さを高めよう。':'まずは解説で、解き方を一つずつ。'}</h2><div class="metrics">${stats.map(s=>`<div><span class="muted">${s.section}</span><b>${s.right}<span class="muted"> / ${s.count}問</span></b></div>`).join('')}<div><span class="muted">所要時間</span><b>${fmt(state.elapsed)}</b></div></div><p class="muted">解答確定 ${answered.length}問 ／ 未回答・未出題 ${state.count-answered.length}問<br>正答率は全${state.count}問が分母です。SPIの得点や合否を予測するものではありません。</p></div></div><div class="result-actions"><button class="start" id="retry">別の問題で受ける <span>↻</span></button><button class="button-quiet" id="back">模試を選び直す</button></div></section><div class="filter"><h2>問題と解説 <span class="muted">${a.length}問</span></h2><label><input type="checkbox" id="wrong-only"> 不正解・未回答のみ</label></div><div id="reviews"></div>`;renderReviews(false);document.querySelector('#wrong-only').onchange=e=>renderReviews(e.target.checked);document.querySelector('#retry').onclick=start;document.querySelector('#back').onclick=home;window.scrollTo(0,0);}
function renderReviews(only){document.querySelector('#reviews').innerHTML=state.answers.map((a,i)=>{if(only&&a.correct)return '';return `<details class="panel details review"><summary><span class="status ${a.correct?'correct':'wrong'}">${a.correct?'正解':a.selected===null?'未回答':'不正解'}</span><span class="review-title">${String(a.number).padStart(2,'0')}　${a.q.section} / ${a.q.type}</span><span class="muted">${Math.round(a.seconds)}秒</span></summary><div class="content"><p class="question-text">${esc(a.q.text)}</p><p>${a.q.input==='numeric'?'数値入力の問題':a.q.options.map((o,i)=>`${'ABCDE'[i]}. ${esc(o)}`).join('<br>')}</p><div class="answer-line">正解：${a.q.input==='numeric'?esc(a.q.numericAnswer+(a.q.unit||'')):`${'ABCDE'[a.q.answer]} ${esc(a.q.options[a.q.answer])}`}<br>あなたの解答：${a.selected===null?'未回答':a.q.input==='numeric'?esc(a.selected):`${'ABCDE'[a.selected]} ${esc(a.q.options[a.selected])}`}</div><p>${esc(a.q.explanation)}</p><span class="muted">設定：${['','基礎','標準','応用'][a.q.level]} ／ 制限 ${a.q.seconds}秒（独自設定）</span></div></details>`;}).join('')||'<p class="intro" style="margin-top:24px">不正解・未回答の問題はありません。</p>';}
window.addEventListener('beforeunload',e=>{if(state?.active){e.preventDefault();e.returnValue='';}});
document.querySelector('.brand').onclick=e=>{if(state?.active){e.preventDefault();document.querySelector('#quit-dialog').showModal();}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});home();


</script></body></html>
